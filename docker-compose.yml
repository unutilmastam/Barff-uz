# =============================================================================
# Lokal ishlab chiqish muhiti: PostgreSQL + Redis + MinIO (S3 o'rniga).
#
# Ishga tushirish:  pnpm docker:up     (yoki: docker compose up -d)
# To'xtatish:       pnpm docker:down
#
# DIQQAT: bu fayl FAQAT lokal ishlab chiqish uchun. Production AWS'da
# (RDS + ElastiCache + S3) — CLAUDE.md §13.
# =============================================================================

name: barff

services:
  postgres:
    image: postgres:16-alpine
    container_name: barff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barff
      POSTGRES_PASSWORD: barff_local_dev
      POSTGRES_DB: barff
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barff -d barff']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: barff-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-mos obyekt saqlash. Konsol: http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: barff-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: barff
      MINIO_ROOT_PASSWORD: barff_local_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Birinchi ishga tushirishda bucket yaratadi, keyin to'xtaydi.
  minio-init:
    image: minio/mc:latest
    container_name: barff-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 barff barff_local_dev &&
      mc mb --ignore-existing local/barff-media &&
      echo 'bucket tayyor: barff-media'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
