packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

# esbuild o'z binarini o'rnatish uchun postinstall skriptini ishga tushiradi.
# pnpm 10 da skriptlar sukut bo'yicha bloklangani uchun aniq ruxsat beramiz.
onlyBuiltDependencies:
  - esbuild
  # @swc/core — NestJS dekoratorlari uchun test transformeri (native binar).
  # @scarf/scarf QASDDAN ro'yxatga kiritilmagan: u telemetriya yuboradi.
  - '@swc/core'
  # argon2 — native parol hashlash moduli.
  - argon2
  # prisma / @prisma/client — klient generatsiyasi.
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
  # unrs-resolver — eslint-config-next ning native resolver'i.
  - unrs-resolver
  # sharp — rasm qayta ishlash uchun native modul.
  - sharp

# Xavfsizlik: tranzit bog'liqliklarning tuzatilgan versiyalari (S41, `pnpm audit --prod`).
# Har biri qaysi zaiflik uchun ekani `docs/SECURITY.md` §3 da.
overrides:
  multer: ^2.5.0
  body-parser: ^2.4.0
  qs: ^6.17.0
  js-yaml@>=5.0.0 <5.5.0: ^5.5.0
  source-map-js: ^1.2.2
  fast-uri@<3.1.9: ^3.1.9
  postcss@<8.5.23: ^8.5.32
  deepmerge-ts@<8.0.0: ^8.0.2
