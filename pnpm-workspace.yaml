packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

# esbuild o'z binarini o'rnatish uchun postinstall skriptini ishga tushiradi.
# pnpm 10 da skriptlar sukut bo'yicha bloklangani uchun aniq ruxsat beramiz.
onlyBuiltDependencies:
  - esbuild
  # @swc/core — NestJS dekoratorlari uchun test transformeri (native binar).
  # @scarf/scarf QASDDAN ro'yxatga kiritilmagan: u telemetriya yuboradi.
  - '@swc/core'
  # argon2 — native parol hashlash moduli.
  - argon2
  # prisma / @prisma/client — klient generatsiyasi.
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
